spring:
  application:
    name: wellness-api
  datasource:
    # Dev: H2 in PostgreSQL mode (zero install). Prod/Supabase: change URL, user and password (see docs/03-database.md)
    url: jdbc:h2:mem:wellness;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only validates it
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # Set WELLNESS_JWT_SECRET (>= 32 chars) in any shared environment. Empty = random key per start (dev: tokens die on restart).
    secret: ${WELLNESS_JWT_SECRET:}
    ttl: 1h
  admin:
    # Empty = a random admin password is generated and logged once when the seeded admin still has the placeholder hash.
    initial-password: ${WELLNESS_ADMIN_PASSWORD:}
